<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ETS2 Pro Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .cluster-housing {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 35px;
        }

        .gauge-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        /* Clean, modern TFT computer display */
        .tft-display-cluster {
            position: relative;
            width: 220px;
            height: 260px;
            background: #111418;
            border: 3px solid #2c323b;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 15px;
            margin-top: -20px;
        }

        .tft-top {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #8b95a5;
            text-transform: uppercase;
        }

        .tft-gear-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1a1e24;
            border-radius: 8px;
            width: 100%;
            padding: 14px 0;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .tft-gear-label {
            font-size: 11px;
            color: #727d8d;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .tft-gear-value {
            font-size: 56px;
            font-weight: 700;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            line-height: 1;
        }

        .tft-info-box {
            width: 100%;
            background: #1a1e24;
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #9aa4b2;
        }

        .tft-info-value {
            font-weight: 600;
            color: #ffffff;
        }

        .tft-info-value.active {
            color: #00e5ff;
        }

        /* Blinkers */
        .blinker-container {
            position: absolute;
            top: 3vh;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20vw;
            z-index: 10;
        }

        .blinker {
            font-size: 46px;
            color: #1a1a1a;
            transition: color 0.05s ease, text-shadow 0.05s ease;
        }

        .blinker.active {
            color: #00ff33;
            text-shadow: 0 0 20px #00ff33, 0 0 40px #00ff33;
        }

        /* Main gauges (420px) and small gauges (175px) */
        .gauge {
            position: relative;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: cover;
            background-position: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.95);
            border: 5px solid #222;
        }

        .gauge-large { width: 420px; height: 420px; }
        .gauge-small { width: 175px; height: 175px; }

        #gauge-speed { background-image: url("{{ url_for('static', filename='img/speed.png') }}"); }
        #gauge-rpm { background-image: url("{{ url_for('static', filename='img/rpm.png') }}"); }
        #gauge-fuel { background-image: url("{{ url_for('static', filename='img/fuel.png') }}"); }
        #gauge-temp { background-image: url("{{ url_for('static', filename='img/temp.png') }}"); }

        .needle-wrapper {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            transform: rotate(-130deg);
            transition: transform 0.04s cubic-bezier(0.2, 1.5, 0.4, 1);
            z-index: 6;
        }

        .needle {
            position: absolute;
            bottom: 50%;
            left: calc(50% - 1.5px);
            width: 3px;
            background: linear-gradient(to top, #b30000 0%, #ff1a1a 100%);
            border-radius: 2px 2px 0 0;
            box-shadow: 0 0 8px rgba(255, 26, 26, 0.9);
        }
        .needle-large { height: 165px; }
        .needle-small { height: 60px; }

        .pivot {
            position: absolute;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, #ffffff 0%, #444444 100%);
            border-radius: 50%;
            z-index: 7;
            box-shadow: 0 3px 6px rgba(0,0,0,0.9);
        }

        .lcd-display {
            position: absolute;
            bottom: 20%;
            width: 100%;
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #00ffcc;
            font-family: 'Segoe UI', Roboto, sans-serif;
            text-shadow: 0 0 10px rgba(0,255,204,0.7);
            z-index: 4;
        }
    </style>
</head>
<body>

    <div class="cluster-housing">
        <div class="blinker-container">
            <div id="blinker-l" class="blinker">◄</div>
            <div id="blinker-r" class="blinker">►</div>
        </div>

        <!-- LEFT COLUMN: SPEED + FUEL -->
        <div class="gauge-column">
            <div class="gauge gauge-large" id="gauge-speed">
                <div class="needle-wrapper" id="speed-needle">
                    <div class="needle needle-large"></div>
                </div>
                <div class="pivot"></div>
                <div class="lcd-display" id="speed-text">0</div>
            </div>

            <div class="gauge gauge-small" id="gauge-fuel">
                <div class="needle-wrapper" id="fuel-needle">
                    <div class="needle needle-small"></div>
                </div>
                <div class="pivot"></div>
            </div>
        </div>

        <!-- CENTRAL TFT COMPUTER DISPLAY -->
        <div class="tft-display-cluster">
            <div class="tft-top">COMPUTER</div>

            <div class="tft-gear-container">
                <div class="tft-gear-label">GEAR</div>
                <div class="tft-gear-value" id="gear-text">N</div>
            </div>

            <div class="tft-info-box">
                <span>CRUISE</span>
                <span id="cc-text" class="tft-info-value">OFF</span>
            </div>
        </div>

        <!-- RIGHT COLUMN: RPM + TEMP -->
        <div class="gauge-column">
            <div class="gauge gauge-large" id="gauge-rpm">
                <div class="needle-wrapper" id="rpm-needle">
                    <div class="needle needle-large"></div>
                </div>
                <div class="pivot"></div>
                <div class="lcd-display" id="rpm-text">0</div>
            </div>

            <div class="gauge gauge-small" id="gauge-temp">
                <div class="needle-wrapper" id="temp-needle">
                    <div class="needle needle-small"></div>
                </div>
                <div class="pivot"></div>
            </div>
        </div>
    </div>

    <script>
        function updateDashboard() {
            fetch('/data')
                .then(response => response.json())
                .then(data => {
                    if (data.connected) {
                        let speed = data.speed;
                        let speedAngle = -130 + (Math.min(speed, 140) / 140) * 260;
                        document.getElementById('speed-needle').style.transform = `rotate(${speedAngle}deg)`;
                        document.getElementById('speed-text').innerText = speed;

                        let rpm = data.rpm;
                        let rpmScaleVal = rpm / 100;
                        let rpmAngle = -130 + (Math.min(rpmScaleVal, 30) / 30) * 260;
                        document.getElementById('rpm-needle').style.transform = `rotate(${rpmAngle}deg)`;
                        document.getElementById('rpm-text').innerText = rpm;

                        let fuel = data.fuel;
                        let fuelAngle = -110 + (Math.min(fuel, 400) / 400) * 220;
                        document.getElementById('fuel-needle').style.transform = `rotate(${fuelAngle}deg)`;

                        let temp = data.temp;
                        let tempAngle = -110 + ((Math.min(Math.max(temp, 40), 120) - 40) / 80) * 220;
                        document.getElementById('temp-needle').style.transform = `rotate(${tempAngle}deg)`;

                        document.getElementById('gear-text').innerText = data.gear;
                        
                        let ccElement = document.getElementById('cc-text');
                        if (data.cruise_on) {
                            ccElement.innerText = data.cruise_speed + " km/h";
                            ccElement.className = "tft-info-value active";
                        } else {
                            ccElement.innerText = "OFF";
                            ccElement.className = "tft-info-value";
                        }

                        document.getElementById('blinker-l').className = data.blinker_left ? "blinker active" : "blinker";
                        document.getElementById('blinker-r').className = data.blinker_right ? "blinker active" : "blinker";

                    } else {
                        document.getElementById('speed-text').innerText = "---";
                        document.getElementById('rpm-text').innerText = "---";
                        document.getElementById('gear-text').innerText = "-";
                    }
                })
                .catch(err => console.log("Error fetching telemetry data"));
        }

        setInterval(updateDashboard, 40);
    </script>
</body>
</html>
